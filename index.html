<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>

  <div id="login-screen" class="screen">
    <form id="login-form" class="card">
      <h1>Sign In</h1>
      <p class="subtitle">Sign in to open the calculator.</p>

      <label for="email">Email</label>
      <input type="email" id="email" required placeholder="you@example.com">

      <label for="password">Password</label>
      <input type="password" id="password" required placeholder="Enter password" minlength="6">

      <p id="error-msg" class="error"></p>

      <button type="submit" id="signin-btn">Sign In</button>
      <button type="button" id="signup-btn">Create Account</button>

      <div class="divider"><span>or</span></div>

      <button type="button" id="google-btn" class="google-btn">Continue with Google</button>
    </form>
  </div>

  <div id="calculator-screen" class="screen hidden">
    <div class="card calculator">
      <div class="calc-header">
        <span id="welcome-msg"></span>
        <button id="logout-btn">Logout</button>
      </div>
      <input type="text" id="calc-display" disabled>
      <div class="calc-buttons">
        <button class="op" data-value="clear">C</button>
        <button class="op" data-value="backspace">⌫</button>
        <button class="op" data-value="%">%</button>
        <button class="op" data-value="/">÷</button>

        <button data-value="7">7</button>
        <button data-value="8">8</button>
        <button data-value="9">9</button>
        <button class="op" data-value="*">×</button>

        <button data-value="4">4</button>
        <button data-value="5">5</button>
        <button data-value="6">6</button>
        <button class="op" data-value="-">−</button>

        <button data-value="1">1</button>
        <button data-value="2">2</button>
        <button data-value="3">3</button>
        <button class="op" data-value="+">+</button>

        <button data-value="0" class="zero">0</button>
        <button data-value=".">.</button>
        <button class="equals" data-value="=">=</button>
      </div>
    </div>
  </div>

<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
